name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Verity.Core -c Release

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: Verity.Core/bin/Release/net10.0/Verity.Core.exe